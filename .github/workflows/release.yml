# Release build: the engine from the flake, the app from Xcode, built twice,
# published only when both builds agree, attested by GitHub.
#
# Pushing a tag v<MARKETING_VERSION> builds the app on two GitHub-hosted
# Macs from that commit alone. If the two zips are not identical byte for
# byte the run fails and nothing is published: a release is proof that the
# commit builds reproducibly, not just that it builds. When they agree, a
# build provenance attestation binds the zip's digest to the commit and to
# this workflow file, and a GitHub Release carries the zip and its checksum.
# Anyone can then check that a download is the build of the commit it
# claims to be:
#
#     gh attestation verify Schtaap-0.1.1-macos.zip --owner jooize
#
# Run by hand (workflow_dispatch) it builds and compares in the same way
# and leaves the zip as a workflow artifact, without attesting or
# releasing.
#
# Signing is ad-hoc. The zip runs on any Apple Silicon Mac, but Gatekeeper
# refuses it until the user allows it under System Settings > Privacy &
# Security. Developer ID signing and notarization replace the identity in
# the "Build app" step and add a notarytool step after "Package"; nothing
# else changes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned: a release must be rebuildable with the compiler that built it.
  # What the image carries is listed at
  # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md
  XCODE_VERSION: "26.4.1"

jobs:
  build:
    strategy:
      matrix:
        attempt: [1, 2]
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notices builder reads the repository through git.
          fetch-depth: 0

      - name: Select Xcode
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "Xcode $XCODE_VERSION is not on this runner image. Available:" >&2
            ls -d /Applications/Xcode_*.app >&2
            exit 1
          fi
          sudo xcode-select --switch "$app"
          xcodebuild -version

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^MARKETING_VERSION *= *//p' macos/Version.xcconfig | head -1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version in macos/Version.xcconfig" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build engine
        run: ./macos/build-engine

      - name: Build app
        run: |
          cd macos
          # CODE_SIGN_IDENTITY "-" is ad-hoc; the project's Apple Development
          # identity only exists on the author's Mac. The build number is the
          # version (Version.xcconfig), so nothing is passed for it.
          xcodebuild -project Schtaap.xcodeproj -scheme Schtaap -configuration Release \
            -derivedDataPath .build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build
          app=.build/Build/Products/Release/Schtaap.app
          codesign --verify --deep --strict --verbose=2 "$app"
          # The scheme pre-action stamped the commit; a "-dirty" here would
          # mean something changed the tree before the build, and the bytes
          # would no longer be the commit's.
          commit="$(/usr/libexec/PlistBuddy -c 'Print GitCommit' "$app/Contents/Info.plist")"
          echo "GitCommit=$commit  CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Contents/Info.plist")"
          [ "$commit" = "$GITHUB_SHA" ] || { echo "::error::built commit $commit is not $GITHUB_SHA" >&2; exit 1; }

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EPOCH: ${{ steps.version.outputs.epoch }}
        run: |
          app=macos/.build/Build/Products/Release/Schtaap.app
          # Every file's mtime becomes the commit's, so the zip depends on
          # the sources and not on when the runner happened to build them.
          stamp="$(TZ=UTC date -u -r "$EPOCH" +%Y%m%d%H%M.%S)"
          TZ=UTC find "$app" -exec touch -h -t "$stamp" {} +
          mkdir dist
          ditto -c -k --keepParent --norsrc --noextattr --noqtn --noacl \
            "$app" "dist/Schtaap-$VERSION-macos.zip"
          (cd dist && shasum -a 256 ./*.zip > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.attempt }}
          path: dist/
          if-no-files-found: error

  # Two runners, one commit, one answer. Anything else is a bug in the
  # build, and the fix is to find what leaked in (a timestamp, a build
  # path, a random name), not to publish anyway.
  compare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
      - name: Compare the two builds
        run: |
          cat dist-1/SHA256SUMS dist-2/SHA256SUMS
          if cmp dist-1/*.zip dist-2/*.zip; then
            echo "The two builds are identical."
          else
            echo "::error::The two builds differ; the build is not reproducible and nothing is released." >&2
            exit 1
          fi

  release:
    if: github.ref_type == 'tag'
    needs: [build, compare]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestation
      attestations: write  # store it
    steps:
      # gh reads the tag's message from the local repository, so the tag
      # must be checked out here; nothing pushes, so no credentials stay.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-1
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The annotated tag's message is the release notes.
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag \
            --title "$GITHUB_REF_NAME" dist/*
