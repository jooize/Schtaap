# XcodeGen source of truth. Regenerate with:  ./macos/generate
#
# The product name is deliberately confined to this file (and the fallback
# string in Sources/Support/Branding.swift). No Swift type carries it, so
# renaming the app is: change `name:` + PRODUCT_BUNDLE_IDENTIFIER here,
# change Branding.swift, rename the two LaunchAgents plists (their labels
# carry the bundle identifier and their program paths the engine helper's
# bundle name), regenerate.
#
# Versions live in Version.xcconfig, never here -- see the project-level
# configFiles below. Target settings must not carry MARKETING_VERSION or
# CURRENT_PROJECT_VERSION, or they would shadow the xcconfig.

name: Schtaap

options:
  bundleIdPrefix: bar.esko
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig

settings:
  base:
    # The product name, in the one place it is allowed to live. The app
    # target takes its PRODUCT_NAME from here, and so does the engine
    # helper's CFBundleName -- the helper is a separate target but must
    # present itself to the user as the app, not as itself.
    APP_PRODUCT_NAME: Schtaap
    # What the engine helper's bundle is called on disk, and so what the
    # Local Network prompt and list call the engine: macOS names an app by
    # its bundle's file name, whatever CFBundleName says (seen 2026-09-10,
    # "EngineHelper" in the prompt title above our own description). The
    # app's name with a suffix, not the app's name: the app asks for Local
    # Network access too (it browses for AirPlay speakers), and two rows
    # both called "Schtaap" would leave the user guessing which switch is
    # which. Branding.engineName reads the bundle's CFBundleName back, so
    # nothing in Swift carries the string.
    ENGINE_PRODUCT_NAME: $(APP_PRODUCT_NAME) Engine

    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO
    CLANG_ENABLE_MODULES: YES
    # Signed with the developer certificate even for Debug, and on purpose.
    # An ad-hoc signature's designated requirement is the binary's cdhash,
    # which changes on every build. launchd records that requirement when
    # the app registers its agents, so every rebuild left it refusing to
    # spawn them (EX_CONFIG), the app re-registering, and macOS posting the
    # "can run in the background" notice again. A certificate-based
    # requirement is stable across builds. Developer ID + notarization
    # arrive with the release pipeline.
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 75NVZ7W4W3
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES

targets:
  # The program launchd runs for both engine agents. A LaunchAgent plist is
  # a static file and cannot name paths that are only known at runtime, so
  # it names this instead and this resolves the rest. The target and the
  # source directory are unbranded; the product is not, see
  # ENGINE_PRODUCT_NAME above, because the product's file name is what the
  # user gets shown.
  #
  # An application bundle, not a bare tool, although it has no UI: macOS
  # names a process to the user from the bundle it belongs to, and a bare
  # executable belongs to none. The Local Network prompt for the engine
  # read "EngineHelper" with Apple's generic text, and the embedded
  # __TEXT,__info_plist that was meant to brand it was ignored (settled
  # 2026-09-08). Only a real bundle is read, and only its file name is
  # shown. It lives in Contents/Helpers, which is where Apple puts helper
  # apps; the LaunchAgent plists name the executable inside it.
  EngineHelper:
    type: application
    platform: macOS
    sources:
      - path: Helper
      # The control socket client, shared with the app: the bridge seeks
      # Spotify back to where the sound stopped when it pauses.
      - path: Sources/Engine/SpotifyControl.swift
      # The session file the bridge writes and the app watches.
      - path: Sources/Engine/SpotifySession.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bar.esko.Schtaap.EngineHelper
        PRODUCT_NAME: $(ENGINE_PRODUCT_NAME)
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    info:
      path: HelperInfo.plist
      properties:
        # The same as the bundle's file name, which is what is actually
        # shown; this key is what the app reads back (Branding.engineName).
        CFBundleName: $(ENGINE_PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # The marketing version, not the build number, on purpose. The build
        # number changes on every build, and the Info.plist is sealed into
        # the bundle's signature, so carrying it would make every build a
        # new helper. The app decides whether to restart the engine by the
        # helper's code directory hash (EngineInstallation.engineFingerprint),
        # and that hash must only move when the helper's code does. The key
        # stays because Apple lists it as required.
        CFBundleVersion: $(MARKETING_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # No UI, no Dock icon, no menu bar, never the frontmost app. It is
        # a supervisor that happens to be packaged as an app.
        LSBackgroundOnly: true
        NSLocalNetworkUsageDescription: >-
          $(APP_PRODUCT_NAME) appears as a speaker in Spotify and plays to
          your AirPlay speakers.

  Schtaap:
    type: application
    platform: macOS
    dependencies:
      # Copied in signed; the app's own signature then seals it as nested
      # code. Contents/Helpers, beside the engine payload's bin and lib.
      - target: EngineHelper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    sources:
      - path: Sources

      # The relocated owntone and librespot payload, built from the flake by
      # ./build-engine. Optional so a clone still builds the UI without Nix;
      # the app then has no engine to register, which it reports rather than
      # pretending otherwise.
      #
      # bin and lib are copied separately from htdocs because codesign walks
      # Contents/Helpers looking for nested code and fails on anything there
      # that is not signable: with the whole payload in one place it stopped
      # on index.html with "code object is not signed at all". Code belongs
      # in a code location and the web root does not. The split also keeps
      # relocate.bash's @executable_path/../lib install names correct, since
      # bin and lib stay siblings.
      - path: Engine/bin
        type: folder
        optional: true
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
      - path: Engine/lib
        type: folder
        optional: true
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
      - path: Engine/htdocs
        type: folder
        optional: true
        buildPhase:
          copyFiles:
            destination: resources
      # Which payload this is, by Nix store path. Read by the app to decide
      # whether a rebuilt engine warrants restarting the agents. Data, so it
      # lives in Resources beside htdocs rather than in Helpers.
      - path: Engine/manifest.json
        optional: true
        buildPhase:
          copyFiles:
            destination: resources
      # The payload's third-party notices, generated by ./build-engine from
      # the same closure: each bundled package, and every license's text.
      - path: Engine/NOTICES.txt
        optional: true
        buildPhase:
          copyFiles:
            destination: resources

      # SMAppService reads agent plists from Contents/Library/LaunchAgents
      # and nowhere else.
      - path: LaunchAgents
        type: folder
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library
    settings:
      base:
        # Reverse-DNS casing: lowercase organization, CamelCase brand segment.
        PRODUCT_BUNDLE_IDENTIFIER: bar.esko.Schtaap
        PRODUCT_NAME: $(APP_PRODUCT_NAME)
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      # Generated by XcodeGen; kept outside Sources/ so it is never
      # swept into the target as a resource.
      path: Info.plist
      properties:
        # No CFBundleDisplayName: the system falls back to CFBundleName, so
        # there is only one name to keep in sync.
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The commit this build came from, stamped by the scheme pre-action.
        # Identification only; nothing orders by it.
        GitCommit: $(GIT_COMMIT)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Tilde Esko. MIT License."
        # A menu bar agent: no Dock icon, no main window, no Settings
        # scene. Everything the app does happens in the popover.
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Required from macOS 15 for Bonjour and AirPlay.
        NSLocalNetworkUsageDescription: >-
          $(PRODUCT_NAME) appears as a speaker in Spotify and plays to
          your AirPlay speakers.
        NSBonjourServices:
          - _airplay._tcp

schemes:
  Schtaap:
    build:
      targets:
        Schtaap: all
      preActions:
        # Runs before Xcode reads the xcconfig, which is the only point early
        # enough to feed a build setting a value from outside. A build phase
        # would run after Info.plist processing. The build number itself is
        # the version (Version.xcconfig); this only records which commit was
        # built, "-dirty" if the tree had changes, "unknown" without git.
        - name: Stamp Commit
          settingsTarget: Schtaap
          script: |
            set -o errexit
            set -o nounset

            commit="$(git -C "${SRCROOT}" rev-parse HEAD 2>/dev/null || printf unknown)"
            if [ "$commit" != unknown ] && [ -n "$(git -C "${SRCROOT}" status --porcelain 2>/dev/null)" ]; then
              commit="${commit}-dirty"
            fi
            printf 'GIT_COMMIT = %s\n' "$commit" > "${SRCROOT}/Commit.xcconfig"
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
