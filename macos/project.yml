# XcodeGen source of truth. Regenerate with:  ./macos/generate
#
# The product name is deliberately confined to this file (and the display
# strings in Sources/Support/Branding.swift). No Swift type carries it, so
# renaming the app is: change `name:` + PRODUCT_BUNDLE_IDENTIFIER here,
# change Branding.swift, regenerate.

name: Tutti

options:
  bundleIdPrefix: bar.esko
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO
    CLANG_ENABLE_MODULES: YES
    # Signing is deliberately unset: local development uses "Sign to Run
    # Locally". Developer ID + notarization arrive with the release pipeline.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES

targets:
  Tutti:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bar.esko.tutti
        PRODUCT_NAME: $(TARGET_NAME)
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      # Generated by XcodeGen; kept outside Sources/ so it is never
      # swept into the target as a resource.
      path: Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Starts as an agent so no Dock icon flashes before the stored
        # presence mode is applied. PresenceMode promotes to .regular.
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

schemes:
  Tutti:
    build:
      targets:
        Tutti: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
